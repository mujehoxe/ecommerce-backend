services:
  - type: web
    name: ecommerce-backend
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
    healthCheckPath: /
    
  - type: pserv
    name: ecommerce-db
    databaseName: ecommerce
    plan: starter
    region: oregon
